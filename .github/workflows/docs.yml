# Build Sphinx HTML and deploy to GitHub Pages.
#
# One-time setup (otherwise deploy-pages fails with HttpError 404):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# Private repos need a paid GitHub plan for Pages (or make the repo public).
# Forks: enable Pages on your fork the same way; upstream settings do not apply.
#
name: Deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "thermal_cable_model/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and doc dependencies
        run: |
          pip install -e .
          pip install -r docs/requirements.txt

      - name: Build HTML
        env:
          SPHINX_HTML_BASEURL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: sphinx-build -b html docs docs/_build/html

      - name: Disable Jekyll (preserve _static paths)
        run: touch docs/_build/html/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
