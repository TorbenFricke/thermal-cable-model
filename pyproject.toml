[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal_fem"
version = "0.1.0"
description = "Cable thermal rating and 2-D FEM temperature field analysis"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["thermal_fem*"]
