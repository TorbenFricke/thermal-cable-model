[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal_cable_model"
version = "0.1.0"
description = "Cable thermal rating analysis for buried power cables"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["thermal_cable_model*"]
